<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms and Conditions &amp; Refund Policy — Learners Point</title>
    <link rel="stylesheet" href="/static/styles.css?v=13">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
</head>
<body class="policy-page">
    <div class="policy-bg" aria-hidden="true"></div>

    <header class="policy-header">
        <a class="policy-brand" href="https://learnerspoint.org" target="_blank" rel="noopener noreferrer">
            <picture>
                <source srcset="/static/brand/learners-point-logo.avif" type="image/avif">
                <img
                    class="policy-logo"
                    src="/static/brand/learners-point-logo.png"
                    width="56"
                    height="56"
                    alt="Learners Point"
                >
            </picture>
            <span class="policy-brand-text">
                <span class="policy-brand-name">Learners Point</span>
                <span class="policy-brand-tag">Academy</span>
            </span>
        </a>
    </header>

    <main class="policy-main">
        <header class="policy-hero">
            <p class="policy-eyebrow">Legal</p>
            <h1 class="policy-title">Terms and Conditions &amp; Refund Policy</h1>
            <p class="policy-lead">
                How we collect and use your information, protect payments, and handle refunds or complaints.
            </p>
        </header>

        <article class="policy-article">
            {% include "_policy_body.html" %}
        </article>
    </main>

    <footer class="policy-footer">
        <p>&copy; Learners Point Academy</p>
    </footer>

</html>
